# Yerel Airflow (LocalExecutor). Çalıştırma: docker compose -f docker/docker-compose.yml up -d --build
# Sırlar kök .env dosyasından gelir; secrets/ klasörü salt okunur bağlanır.
name: enerji

x-airflow: &airflow
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: enerji-airflow:3.1.8
  env_file: ../.env
  environment: &airflow-env
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/bq.json
    TZ: Europe/Istanbul
    # Sırlar kök .env'den (env_file) gelir; Airflow `_CMD` ile çalışma anında okur, böylece
    # `docker compose exec ... airflow ...` komutları da aynı ayarı görür.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
      bash -c 'printf %s "postgresql+psycopg2://airflow:$$POSTGRES_PASSWORD@postgres/airflow"'
    AIRFLOW__CORE__FERNET_KEY_CMD: printenv AIRFLOW_FERNET_KEY
    AIRFLOW__API__SECRET_KEY_CMD: printenv AIRFLOW_SECRET_KEY
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: printenv AIRFLOW_JWT_SECRET
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Istanbul
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:8081
    AIRFLOW__API__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ..:/opt/project
    - ../secrets:/run/secrets:ro   # bq.json (zorunlu), publisher.json (yayın için; yoksa publish atlanır)
    - enerji-logs:/opt/airflow/logs
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    env_file: ../.env
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
    volumes:
      - enerji-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username="$$AIRFLOW_ADMIN_USER" --password="$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Admin --lastname Admin --role Admin --email admin@example.com \
          || echo "kullanıcı zaten var")
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_started

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Panel için veri hattı durumu: Airflow API'sini 20 sn'de bir okur, pipeline_status.json'u kovaya yazar.
  pipeline-status:
    <<: *airflow
    command:
      - bash
      - -c
      - cd /opt/project && exec /opt/project-venv/bin/python -X utf8 -m scripts.pipeline_status --loop 20
    mem_limit: 256m
    depends_on:
      airflow-apiserver:
        condition: service_healthy

volumes:
  enerji-pgdata:
  enerji-logs:
