version: 2

seeds:
  - name: source_types
    description: >
      Kontrollü kaynak türü sözlüğü (tek tanım). Anahtarlar, etiketler ve sıra
      contracts/source_labels.json ile birebir aynıdır; biri değişirse ikisi birlikte değişir.
      Grain: bir satır = bir source_type.
    config:
      column_types:
        source_type: string
        label_tr: string
        is_renewable: boolean
        sort_order: int64
    columns:
      - name: source_type
        description: Kontrollü sözlük anahtarı (İngilizce snake_case).
        data_tests: [unique, not_null]
      - name: label_tr
        description: Panelde gösterilen Türkçe etiket.
        data_tests: [not_null]
      - name: is_renewable
        description: Yenilenebilir mi (sözleşme tanımı, source_labels.json).
        data_tests: [not_null]
      - name: sort_order
        description: Grafiklerde yığılma ve gösterim sırası (1 = ilk).
        data_tests: [unique, not_null]

  - name: epias_fuel_map
    description: >
      EPİAŞ yakıt kolonu → source_type eşlemesi. importExport ve total bilerek yok
      (total dış ticareti içerir). Grain: bir satır = bir EPİAŞ yakıt kolonu.
    config:
      column_types:
        epias_column: string
        source_type: string
    columns:
      - name: epias_column
        description: EPİAŞ rt-gen / rt-gen-bulk kolon adı (büyük/küçük harf duyarlı).
        data_tests: [unique, not_null]
      - name: source_type
        description: Karşılık gelen kaynak türü.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('source_types')
                field: source_type

  - name: unlicensed_fuel_map
    description: >
      Lisanssız üretim (ren-ul-gen) kolonu → source_type eşlemesi. toplam bilerek yok.
      Grain: bir satır = bir lisanssız üretim kolonu.
    config:
      column_types:
        unlicensed_column: string
        source_type: string
    columns:
      - name: unlicensed_column
        description: ren-ul-gen ham kolon adı.
        data_tests: [unique, not_null]
      - name: source_type
        description: Karşılık gelen kaynak türü.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('source_types')
                field: source_type

  - name: source_type_families
    description: >
      source_type → kaba yakıt ailesi (plant_family) eşlemesi. Aile kümesi stg_plant_locations
      ile aynıdır (gas, hydro, coal, solar, wind, geothermal, bio) + 'other' (nükleer, fueloil,
      nafta, atık ısı). Eşleştirme adaylarını aynı aile içinde aramak için kullanılır.
      Grain: bir satır = bir source_type.
    config:
      column_types:
        source_type: string
        plant_family: string
    columns:
      - name: source_type
        description: Kontrollü kaynak türü.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('source_types')
                field: source_type
      - name: plant_family
        description: Kaba yakıt ailesi.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['gas', 'hydro', 'coal', 'solar', 'wind', 'geothermal', 'bio', 'other']

  - name: plant_match_candidates
    description: >
      ÜRETİLMİŞ DOSYA, elle düzenlenmez: `python -m scripts.match_plants` yazar. Her EPİAŞ santrali
      için aynı yakıt ailesindeki en iyi GEM/OSM konum adayı (eşik uygulanmamış; eşik
      int_plants_matched'te var match_min_score ile uygulanır). Adayı olmayan santral satırsızdır.
      Grain: bir satır = bir plant_id.
    config:
      column_types:
        plant_id: int64
        location_source: string
        location_id: string
        score: float64
        method: string
    columns:
      - name: plant_id
        description: EPİAŞ santral kimliği.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_epias__power_plants')
                field: plant_id
      - name: location_source
        description: "'gem' veya 'osm'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['gem', 'osm']
      - name: location_id
        description: stg_plant_locations.location_id.
        data_tests: [not_null]
      - name: score
        description: Düzeltilmiş benzerlik puanı, 0-100 (bkz. scripts/match_plants.py başlığı).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: method
        description: "'exact_name' (normalize adlar aynı, puan 100) veya 'fuzzy_name'."
        data_tests:
          - accepted_values:
              arguments:
                values: ['exact_name', 'fuzzy_name']
