version: 2

models:
  - name: dim_plants
    description: >
      Grain: bir satır = bir EPİAŞ santrali (plant_id); santral listesinin en son snapshot'ındaki her
      santral, üretimi olmasa da. Konum, il ve eşleşme bilgisi int_plants_matched'ten; baskın kaynak ve
      30 günlük üretim int_plant_profile'dan. plants.json bu tablodan (generation_mwh_30d > 0) üretilir.
    columns:
      - name: plant_id
        description: EPİAŞ santral kimliği (pp_id).
        data_tests: [unique, not_null]
      - name: plant_name
        description: Temizlenmiş EPİAŞ adı (EIC eki atılmış).
        data_tests: [not_null]
      - name: source_type
        description: Son 30 tam günde en çok MWh üreten source_type (baskın kaynak). Üretimi yoksa NULL.
        data_tests:
          - accepted_values:
              arguments:
                values: ['solar', 'wind', 'hydro_dam', 'hydro_river', 'natural_gas', 'imported_coal', 'lignite', 'geothermal', 'biomass', 'nuclear', 'other']
      - name: plant_family
        description: Kaba yakıt ailesi (seed source_type_families). Üretimi yoksa NULL.
      - name: generation_mwh_30d
        description: Son 30 tam günün lisanslı üretimi, MWh (int_plant_profile penceresi).
        data_tests: [not_null]
      - name: is_located
        description: Koordinatı var mı. false = "konum bilinmiyor"; üretimi mart'larda yine sayılır.
        data_tests: [not_null]
      - name: latitude
        description: Enlem (WGS84), GEM/OSM konum kaydından. Konum yoksa NULL.
      - name: longitude
        description: Boylam (WGS84). Konum yoksa NULL.
      - name: plate_code
        description: İl plaka kodu (nokta-poligon; kıyıda 10 km içindeki en yakın il). Konum yoksa NULL.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_provinces')
                field: plate_code
      - name: province_name
        description: İl adı (geoBoundaries). plate_code NULL ise NULL.
      - name: match_method
        description: "'override' (elle düzeltme), 'fuzzy' (aday, eşik üstü) veya 'none'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['override', 'fuzzy', 'none']
      - name: match_confidence
        description: Eşleşme güveni 0-1 (override = 1,0; fuzzy = puan / 100; none = NULL).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: location_source
        description: "Koordinatın kaynağı: 'gem', 'osm' veya NULL."
        data_tests:
          - accepted_values:
              arguments:
                values: ['gem', 'osm']
      - name: location_id
        description: stg_plant_locations.location_id veya NULL.
      - name: location_plant_count
        description: Aynı konum kaydını kullanan santral sayısı (konum yoksa NULL). Kurulu güç kuralının girdisi.
      - name: is_location_proxy
        description: Konum kaydı aynı sahadaki başka bir tesis (vekil). Koordinat geçerli, gücü değil.
        data_tests: [not_null]
      - name: installed_capacity_mw
        description: >
          Kurulu güç, MW, konum kaydından (GEM işletmedeki birimler toplamı ya da OSM etiketi; EPİAŞ değil).
          KURAL (kullanıcı kararı): yalnızca konum kaydını tek bir santral kullanıyorsa
          (location_plant_count = 1) ve kayıt vekil değilse dolu; paylaşılan sahada (ZETES, Karapınar...)
          ve vekil kayıtta (TÜPRAŞ) NULL = "bilinmiyor". Kayıtta güç yoksa da NULL.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: fct_generation_hourly
    description: >
      Grain: bir satır = bir saat x bir santral (plant_id). Lisanslı üretim (rt-gen-bulk), santralin bütün
      yakıtlarının toplamı; sıfır üretimli santral-saatler yoktur. Artımlı (insert_overwrite): her çalışmada
      son var('lookback_hours') saati içeren UTC günlerinin bölümleri baştan yazılır. Böylece EPİAŞ'ın
      sonradan sıfıra çektiği (staging'de atılan) santral-saatler de silinir; merge bunları bırakırdı.
      assert_fct_rows_exist_in_staging son 7 günde bayat satır olmadığını denetler. Bölüm: hour_start_at_utc (gün, UTC); yerel güne göre
      okurken bölüm budaması için hour_start_at_utc aralığı da verilmeli. Kaynak bazlı ayrım ve il için
      agg_generation_by_province_hourly; santral nitelikleri için dim_plants.
    columns:
      - name: hour_start_at_utc
        description: Saatin BAŞLANGICI, UTC (TIMESTAMP). Bölüm kolonu.
        data_tests: [not_null]
      - name: hour_start_tr
        description: Saatin BAŞLANGICI, İstanbul yerel saati (DATETIME, +03:00).
        data_tests: [not_null]
      - name: date_tr
        description: Saatin İstanbul yerel günü.
        data_tests: [not_null]
      - name: plant_id
        description: EPİAŞ santral kimliği.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plants')
                field: plant_id
      - name: source_type
        description: >
          Santralin O SAATTEKİ baskın yakıtı (en çok MW; eşitlikte source_types sırası). Saatten
          bağımsız 30 günlük baskın kaynak dim_plants.source_type'tadır.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['solar', 'wind', 'hydro_dam', 'hydro_river', 'natural_gas', 'imported_coal', 'lignite', 'geothermal', 'biomass', 'nuclear', 'other']
      - name: generation_mw
        description: O saatteki ortalama güç, MW (= saatlik MWh), santralin bütün yakıtları toplamı. Negatif olabilir (iç tüketim).
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [hour_start_at_utc, plant_id]

  - name: agg_generation_by_source_hourly
    description: >
      Grain: bir satır = bir saat x bir source_type. Ülke verisi (rt-gen): lisanslı yurt içi üretim, dış
      ticaret (importExport) ve EPİAŞ total'i hariç; toplam kaynak kolonlarından yeniden hesaplanır.
      Saatin toplamı, yenilenebilir payı (seed source_types.is_renewable) ve aynı saatin PTF'si satıra
      tekrarlanır. En yeni saat ön veridir (is_finalized = false). Canlı sayaçlar ve mix_24h buradan.
    columns:
      - name: hour_start_at_utc
        description: Saatin BAŞLANGICI, UTC.
        data_tests: [not_null]
      - name: hour_start_tr
        description: Saatin BAŞLANGICI, İstanbul yerel saati (DATETIME).
        data_tests: [not_null]
      - name: date_tr
        description: İstanbul yerel günü.
        data_tests: [not_null]
      - name: source_type
        description: Kontrollü kaynak türü.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['solar', 'wind', 'hydro_dam', 'hydro_river', 'natural_gas', 'imported_coal', 'lignite', 'geothermal', 'biomass', 'nuclear', 'other']
      - name: is_renewable
        description: Kaynak yenilenebilir mi (seed source_types; sözleşmedeki tanım).
        data_tests: [not_null]
      - name: generation_mw
        description: O saatteki ortalama güç, MW (= saatlik MWh).
        data_tests: [not_null]
      - name: share_pct
        description: Kaynağın saat toplamı içindeki payı, yüzde (0-100). Toplam 0 ise NULL.
      - name: total_generation_mw
        description: Saatin toplam lisanslı yurt içi üretimi, MW (dış ticaret hariç).
        data_tests: [not_null]
      - name: renewable_generation_mw
        description: Saatin yenilenebilir üretimi, MW.
        data_tests: [not_null]
      - name: renewable_share_pct
        description: Saatin yenilenebilir payı, yüzde (0-100).
      - name: price_try_per_mwh
        description: Aynı saatin PTF'si (gün öncesi piyasa takas fiyatı), TL/MWh. Yoksa NULL.
      - name: is_finalized
        description: >
          Saat kesinleşmiş mi: tablodaki en yeni saatten önceki her saat true. En yeni saat ön veridir
          (sözleşme, "Kesinleşmiş saat kuralı").
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [hour_start_at_utc, source_type]

  - name: agg_generation_by_province_hourly
    description: >
      Grain: bir satır = bir saat x bir il (province_key) x bir source_type. Santral verisi (rt-gen-bulk),
      lisanslı. Konumu ya da ili bilinmeyen santrallerin üretimi atılmaz: plate_code NULL,
      is_unlocated = true, province_key = 0 satırında toplanır; saat toplamı fct_generation_hourly ile aynıdır.
      Artımlı (insert_overwrite): son var('lookback_hours') saati içeren UTC günlerinin bölümleri baştan
      yazılır (sıfıra çekilen saatler de kaybolur). Eşleştirme değişince
      (plant_match_overrides, plant_match_candidates) `--full-refresh` gerekir; unutulursa
      assert_province_agg_matches_current_matching testi son 7 günde yakalar.
    columns:
      - name: hour_start_at_utc
        description: Saatin BAŞLANGICI, UTC. Bölüm kolonu.
        data_tests: [not_null]
      - name: hour_start_tr
        description: Saatin BAŞLANGICI, İstanbul yerel saati (DATETIME).
        data_tests: [not_null]
      - name: date_tr
        description: İstanbul yerel günü.
        data_tests: [not_null]
      - name: province_key
        description: NULL olmayan il anahtarı = plate_code; konumsuz satırda 0 (küme kolonu, tekillik testi). Analizde plate_code / is_unlocated kullanın.
        data_tests: [not_null]
      - name: plate_code
        description: İl plaka kodu (1-81). Konumsuz satırda NULL.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_provinces')
                field: plate_code
      - name: province_name
        description: İl adı. Konumsuz satırda NULL.
      - name: is_unlocated
        description: Bu satır konumu/ili bilinmeyen santrallerin toplamı mı ("konum bilinmiyor").
        data_tests: [not_null]
      - name: source_type
        description: Kontrollü kaynak türü (santral üretiminin yakıtı).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['solar', 'wind', 'hydro_dam', 'hydro_river', 'natural_gas', 'imported_coal', 'lignite', 'geothermal', 'biomass', 'nuclear', 'other']
      - name: generation_mw
        description: O saatteki ortalama güç, MW (= saatlik MWh), ilin o kaynaktaki santralleri toplamı.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [hour_start_at_utc, province_key, source_type]

  - name: mart_live_snapshot
    description: >
      Grain: tek satır (assert_live_snapshot_one_row). Panelin "şu an" özeti (snapshot_latest.json).
      Kesinleşmiş saat kuralı (sözleşme, karar 2026-11-08): live saati = ülke verisindeki en yeni saat
      - 1 saat (assert_live_hour_is_one_before_latest); en yeni saat ön veridir, provisional_* kolonlarında.
      plants_day = santral verisinin 24 saati tam en son yerel günü (son 14 gün içinde aranır; yoksa NULL
      ve not_null testi düşer). Lisanssız güneş notu son yayımlanan aydan. Toplamlar lisanslı yurt içi
      üretim, dış ticaret hariç.
    columns:
      - name: live_hour_start_at_utc
        description: Kesinleşmiş (live) saatin BAŞLANGICI, UTC = provisional_hour_start_at_utc - 1 saat.
        data_tests: [not_null]
      - name: live_hour_start_tr
        description: Aynı saat, İstanbul yerel saati (DATETIME).
        data_tests: [not_null]
      - name: live_total_mw
        description: Live saatin lisanslı yurt içi üretimi, MW. Saat verisi yoksa NULL (test düşer).
        data_tests: [not_null]
      - name: live_renewable_share_pct
        description: Live saatin yenilenebilir payı, yüzde.
        data_tests: [not_null]
      - name: live_price_try_per_mwh
        description: Live saatin PTF'si, TL/MWh. Yoksa NULL.
      - name: live_by_source
        description: >
          Live saatin kaynak dağılımı, ARRAY<STRUCT<source_type, generation_mw, share_pct>>, source_types
          sırasında. Sıfır üretimli kaynaklar da vardır (dışa aktarma sözleşme gereği atar).
      - name: provisional_hour_start_at_utc
        description: Ülke verisindeki en yeni saat (ön veri), UTC.
        data_tests: [not_null]
      - name: provisional_hour_start_tr
        description: Aynı saat, İstanbul yerel saati.
      - name: provisional_total_mw
        description: Ön veri saatinin toplamı, MW (sonradan yukarı revize edilebilir).
        data_tests: [not_null]
      - name: plants_day_date_tr
        description: Santral verisinin 24 saati tam en son yerel günü (canlı modda haritanın günü).
        data_tests: [not_null]
      - name: plants_day_last_hour_start_at_utc
        description: O günün son saatinin BAŞLANGICI (yerel 23:00), UTC.
        data_tests: [not_null]
      - name: plants_day_last_hour_start_tr
        description: Aynı saat, İstanbul yerel saati.
      - name: plants_day_total_mw_last_hour
        description: O saatteki santral toplamı, MW.
        data_tests: [not_null]
      - name: plants_day_plant_count
        description: O gün toplam üretimi > 0 olan santral sayısı (generation_24h.json ile aynı küme).
        data_tests: [not_null]
      - name: unlicensed_solar_month
        description: Lisanssız verinin son yayımlanan ayının ilk günü (DATE).
        data_tests: [not_null]
      - name: unlicensed_solar_avg_mw
        description: O ayın ortalama lisanssız güneş üretimi, MW (ren-ul-gen gunes). Sayaçlara eklenmez.
        data_tests: [not_null]
      - name: unlicensed_solar_peak_mw
        description: O ayda yerel saat başına ortalamaların en büyüğü, MW ("öğlen tepe").
        data_tests: [not_null]
