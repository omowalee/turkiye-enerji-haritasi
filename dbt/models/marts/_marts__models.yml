version: 2

models:
  - name: dim_plants
    description: >
      Grain: bir satır = bir EPİAŞ santrali (plant_id); santral listesinin en son snapshot'ındaki her
      santral, üretimi olmasa da. Konum, il ve eşleşme bilgisi int_plants_matched'ten; baskın kaynak ve
      30 günlük üretim int_plant_profile'dan. plants.json bu tablodan (generation_mwh_30d > 0) üretilir.
    columns:
      - name: plant_id
        description: EPİAŞ santral kimliği (pp_id).
        data_tests: [unique, not_null]
      - name: plant_name
        description: Temizlenmiş EPİAŞ adı (EIC eki atılmış).
        data_tests: [not_null]
      - name: source_type
        description: Son 30 tam günde en çok MWh üreten source_type (baskın kaynak). Üretimi yoksa NULL.
        data_tests:
          - accepted_values:
              arguments:
                values: ['solar', 'wind', 'hydro_dam', 'hydro_river', 'natural_gas', 'imported_coal', 'lignite', 'geothermal', 'biomass', 'nuclear', 'other']
      - name: plant_family
        description: Kaba yakıt ailesi (seed source_type_families). Üretimi yoksa NULL.
      - name: generation_mwh_30d
        description: Son 30 tam günün lisanslı üretimi, MWh (int_plant_profile penceresi).
        data_tests: [not_null]
      - name: is_located
        description: Koordinatı var mı. false = "konum bilinmiyor"; üretimi mart'larda yine sayılır.
        data_tests: [not_null]
      - name: latitude
        description: Enlem (WGS84), GEM/OSM konum kaydından. Konum yoksa NULL.
      - name: longitude
        description: Boylam (WGS84). Konum yoksa NULL.
      - name: plate_code
        description: İl plaka kodu (nokta-poligon; kıyıda 10 km içindeki en yakın il). Konum yoksa NULL.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_provinces')
                field: plate_code
      - name: province_name
        description: İl adı (geoBoundaries). plate_code NULL ise NULL.
      - name: match_method
        description: "'override' (elle düzeltme), 'fuzzy' (aday, eşik üstü) veya 'none'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['override', 'fuzzy', 'none']
      - name: match_confidence
        description: Eşleşme güveni 0-1 (override = 1,0; fuzzy = puan / 100; none = NULL).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: location_source
        description: "Koordinatın kaynağı: 'gem', 'osm' veya NULL."
        data_tests:
          - accepted_values:
              arguments:
                values: ['gem', 'osm']
      - name: location_id
        description: stg_plant_locations.location_id veya NULL.
      - name: location_plant_count
        description: Aynı konum kaydını kullanan santral sayısı (konum yoksa NULL). Kurulu güç kuralının girdisi.
      - name: is_location_proxy
        description: Konum kaydı aynı sahadaki başka bir tesis (vekil). Koordinat geçerli, gücü değil.
        data_tests: [not_null]
      - name: installed_capacity_mw
        description: >
          Kurulu güç, MW, konum kaydından (GEM işletmedeki birimler toplamı ya da OSM etiketi; EPİAŞ değil).
          KURAL (kullanıcı kararı): yalnızca konum kaydını tek bir santral kullanıyorsa
          (location_plant_count = 1) ve kayıt vekil değilse dolu; paylaşılan sahada (ZETES, Karapınar...)
          ve vekil kayıtta (TÜPRAŞ) NULL = "bilinmiyor". Kayıtta güç yoksa da NULL.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: fct_generation_hourly
    description: >
      Grain: bir satır = bir saat x bir santral (plant_id). Lisanslı üretim (rt-gen-bulk), santralin bütün
      yakıtlarının toplamı; sıfır üretimli santral-saatler yoktur. Artımlı (merge), her çalışmada son
      var('lookback_hours') saat yeniden işlenir. Bölüm: hour_start_at_utc (gün, UTC); yerel güne göre
      okurken bölüm budaması için hour_start_at_utc aralığı da verilmeli. Kaynak bazlı ayrım ve il için
      agg_generation_by_province_hourly; santral nitelikleri için dim_plants.
    columns:
      - name: hour_start_at_utc
        description: Saatin BAŞLANGICI, UTC (TIMESTAMP). Bölüm kolonu.
        data_tests: [not_null]
      - name: hour_start_tr
        description: Saatin BAŞLANGICI, İstanbul yerel saati (DATETIME, +03:00).
        data_tests: [not_null]
      - name: date_tr
        description: Saatin İstanbul yerel günü.
        data_tests: [not_null]
      - name: plant_id
        description: EPİAŞ santral kimliği.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plants')
                field: plant_id
      - name: source_type
        description: >
          Santralin O SAATTEKİ baskın yakıtı (en çok MW; eşitlikte source_types sırası). Saatten
          bağımsız 30 günlük baskın kaynak dim_plants.source_type'tadır.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['solar', 'wind', 'hydro_dam', 'hydro_river', 'natural_gas', 'imported_coal', 'lignite', 'geothermal', 'biomass', 'nuclear', 'other']
      - name: generation_mw
        description: O saatteki ortalama güç, MW (= saatlik MWh), santralin bütün yakıtları toplamı. Negatif olabilir (iç tüketim).
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [hour_start_at_utc, plant_id]

  - name: agg_generation_by_source_hourly
    description: >
      Grain: bir satır = bir saat x bir source_type. Ülke verisi (rt-gen): lisanslı yurt içi üretim, dış
      ticaret (importExport) ve EPİAŞ total'i hariç; toplam kaynak kolonlarından yeniden hesaplanır.
      Saatin toplamı, yenilenebilir payı (seed source_types.is_renewable) ve aynı saatin PTF'si satıra
      tekrarlanır. En yeni saat ön veridir (is_finalized = false). Canlı sayaçlar ve mix_24h buradan.
    columns:
      - name: hour_start_at_utc
        description: Saatin BAŞLANGICI, UTC.
        data_tests: [not_null]
      - name: hour_start_tr
        description: Saatin BAŞLANGICI, İstanbul yerel saati (DATETIME).
        data_tests: [not_null]
      - name: date_tr
        description: İstanbul yerel günü.
        data_tests: [not_null]
      - name: source_type
        description: Kontrollü kaynak türü.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['solar', 'wind', 'hydro_dam', 'hydro_river', 'natural_gas', 'imported_coal', 'lignite', 'geothermal', 'biomass', 'nuclear', 'other']
      - name: is_renewable
        description: Kaynak yenilenebilir mi (seed source_types; sözleşmedeki tanım).
        data_tests: [not_null]
      - name: generation_mw
        description: O saatteki ortalama güç, MW (= saatlik MWh).
        data_tests: [not_null]
      - name: share_pct
        description: Kaynağın saat toplamı içindeki payı, yüzde (0-100). Toplam 0 ise NULL.
      - name: total_generation_mw
        description: Saatin toplam lisanslı yurt içi üretimi, MW (dış ticaret hariç).
        data_tests: [not_null]
      - name: renewable_generation_mw
        description: Saatin yenilenebilir üretimi, MW.
        data_tests: [not_null]
      - name: renewable_share_pct
        description: Saatin yenilenebilir payı, yüzde (0-100).
      - name: price_try_per_mwh
        description: Aynı saatin PTF'si (gün öncesi piyasa takas fiyatı), TL/MWh. Yoksa NULL.
      - name: is_finalized
        description: >
          Saat kesinleşmiş mi: tablodaki en yeni saatten önceki her saat true. En yeni saat ön veridir
          (sözleşme, "Kesinleşmiş saat kuralı").
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [hour_start_at_utc, source_type]
