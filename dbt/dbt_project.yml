name: energy_map
version: "0.1.0"
config-version: 2

flags:
  send_anonymous_usage_stats: false
  use_colors: false
profile: energy_map

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # EPIAS can revise recent hours; incremental models reprocess this many hours back.
  lookback_hours: 48
  # Share of licensed generation (last 30 complete days) from plants without location.
  # User decision 2026-11-08: warn above 10 %, error above 15 % (assert_unmatched_generation_share).
  unmatched_share_warn: 0.10
  unmatched_share_error: 0.15
  # Plant day (single day): warn-only check, daily share swings with wind (user decision 2026-11-08).
  unmatched_share_daily_warn: 0.15
  # Minimum fuzzy score (0-100, scripts/match_plants.py) to accept a plant-location candidate.
  match_min_score: 90

models:
  energy_map:
    staging:
      +materialized: view
      +schema: epias_staging
    intermediate:
      +materialized: view
      +schema: epias_staging
    marts:
      +schema: epias_marts

seeds:
  energy_map:
    +schema: epias_staging
